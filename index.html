// ====== КОД ======

function getServers() {
    return config.outbounds.filter(o => 
        o.protocol === 'vless' || o.protocol === 'vmess' || o.protocol === 'trojan'
    );
}

function renderServers() {
    const container = document.getElementById('serversList');
    container.innerHTML = '';
    
    const servers = getServers();
    
    servers.forEach(s => {
        const address = s.settings?.vnext?.[0]?.address || '—';
        const port = s.settings?.vnext?.[0]?.port || '—';
        const network = s.streamSettings?.network || 'tcp';
        const security = s.streamSettings?.security || 'none';
        const tag = s.tag || 'server';
        
        const div = document.createElement('div');
        div.className = 'server';
        div.innerHTML = `
            <div>
                <div class="name">${tag}</div>
                <div class="address">${address}:${port}</div>
                <div class="tag">${network} | ${security}</div>
            </div>
            <div>
                <span class="protocol">${s.protocol}</span>
                ${security === 'reality' ? ' <span class="badge">Reality</span>' : ''}
            </div>
        `;
        container.appendChild(div);
    });
    
    document.getElementById('subName').textContent = `🌐 ${config.remarks || 'Подписка'}`;
    document.getElementById('subInfo').textContent = `${servers.length} серверов доступно`;
    document.getElementById('serverCount').textContent = `${servers.length} серверов`;
}

function generateVlessLink(server) {
    const vnext = server.settings?.vnext?.[0];
    if (!vnext) return '';
    
    const user = vnext.users?.[0];
    if (!user) return '';
    
    const stream = server.streamSettings || {};
    const reality = stream.realitySettings || {};
    
    const params = new URLSearchParams();
    params.append('encryption', user.encryption || 'none');
    if (user.flow) params.append('flow', user.flow);
    if (stream.security) params.append('security', stream.security);
    if (reality.serverName) params.append('sni', reality.serverName);
    if (reality.fingerprint) params.append('fp', reality.fingerprint);
    if (reality.publicKey) params.append('pbk', reality.publicKey);
    if (reality.shortId) params.append('sid', reality.shortId);
    
    if (stream.network === 'xhttp' && stream.xhttpSettings) {
        params.append('type', 'xhttp');
        params.append('path', stream.xhttpSettings.path || '');
        params.append('host', stream.xhttpSettings.host || '');
    } else if (stream.network === 'grpc' && stream.grpcSettings) {
        params.append('type', 'grpc');
        params.append('serviceName', stream.grpcSettings.serviceName || '');
    } else if (stream.network === 'tcp' || stream.network === 'raw') {
        params.append('type', 'tcp');
    }
    
    const cleanParams = new URLSearchParams();
    for (const [key, value] of params) {
        if (value) cleanParams.append(key, value);
    }
    
    const query = cleanParams.toString();
    const hash = server.tag || 'server';
    
    return `vless://${user.id}@${vnext.address}:${vnext.port}?${query}#${encodeURIComponent(hash)}`;
}

function generateSubscription() {
    const servers = getServers();
    const links = servers.map(s => generateVlessLink(s)).filter(l => l);
    const text = links.join('\n');
    return btoa(text);
}

function copySubscriptionLink() {
    const baseUrl = window.location.href.split('?')[0];
    const subLink = `${baseUrl}?sub=1`;
    
    navigator.clipboard.writeText(subLink)
        .then(() => alert('✅ Ссылка подписки скопирована!\n\nВставьте её в приложение (Happ, v2rayN, Shadowrocket)'))
        .catch(() => {
            const input = document.createElement('input');
            input.value = subLink;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            alert('✅ Ссылка подписки скопирована!');
        });
}

function handleSubscriptionRequest() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('sub') === '1') {
        const subscription = generateSubscription();
        document.body.innerHTML = subscription;
        document.body.style.whiteSpace = 'pre-wrap';
        document.body.style.wordBreak = 'break-all';
        return true;
    }
    return false;
}

if (!handleSubscriptionRequest()) {
    renderServers();
