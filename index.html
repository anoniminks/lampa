<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подписка</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: #f0f0f0; padding: 12px 16px; margin: 8px 0; border-radius: 8px; }
        .server { border-bottom: 1px solid #ddd; padding: 12px 0; }
        .online { color: green; }
        .tag { background: #007bff; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
        button { padding: 12px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .loading { color: #888; }
        .protocol { background: #e9ecef; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>📋 Подписка</h1>
    <div id="info"><div class="loading">Загрузка...</div></div>
    
    <h2>🖥️ Сервера</h2>
    <div id="servers"><div class="loading">Загрузка...</div></div>
    
    <br>
    <button onclick="copyLink()">📋 Скопировать ссылку</button>

    <script src="script.js"></script>
</body>
</html>
